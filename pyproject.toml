[project]
name = "amazing-marvin"
version = "0.1.0"
description = "Personal scripts for the Amazing Marvin task management system"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "ibmcloudant>=0.10",
    "ipympl>=0.9.4",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "mplcursors>=0.6",
    "numpy>=2.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "black>=25.1",
    "flake8>=7.1",
    "isort>=6.0",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
]

[tool.uv]
# The scripts run from the repository root. Nothing here is built or published.
package = false

[tool.black]
line-length = 140
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 140

[tool.mypy]
python_version = "3.12"
files = ["amazing"]
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The cloudant SDK ships no py.typed marker, so mypy cannot read its types.
module = "ibmcloudant.*"
ignore_missing_imports = true
