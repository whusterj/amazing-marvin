[project]
name = "amazing-marvin"
version = "0.1.0"
description = "Personal scripts for the Amazing Marvin task management system"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "ibmcloudant>=0.10",
    "ipympl>=0.9.4",
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "mplcursors>=0.6",
    "numpy>=2.1",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.14",
]

[tool.uv]
# The scripts run from the repository root. Nothing here is built or published.
package = false

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# E and F are what flake8 checked here, and I is what isort did.
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["amazing", "agent_scripts"]
# Without this, mypy reads no unannotated function body, and misses what is in
# them. It found a real fault in api_test_endpoint the moment it was switched on.
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# The cloudant SDK ships no py.typed marker, so mypy cannot read its types.
module = ["ibmcloudant.*", "ibm_cloud_sdk_core.*"]
ignore_missing_imports = true
