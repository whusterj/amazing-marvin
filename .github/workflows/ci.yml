name: CI

on: push

jobs:
  pytest:
    runs-on: ubuntu-latest
    container: nixos/nix:latest

    env:
      CLOUDANT_AUTH_TYPE: "BASIC"
      CLOUDANT_URL: ${{ secrets.CLOUDANT_URL }}
      CLOUDANT_SYNC_DB: ${{ secrets.CLOUDANT_SYNC_DB}}
      CLOUDANT_USERNAME: ${{ secrets.CLOUDANT_USERNAME }}
      CLOUDANT_PASSWORD: ${{ secrets.CLOUDANT_PASSWORD }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      FULL_ACCESS_TOKEN: ${{ secrets.FULL_ACCESS_TOKEN }}

    steps:
      - name: Manual checkout (no Node.js required!)
        run: |
          git clone \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} .
          git checkout ${{ github.sha }}
          echo "📁 Checked out ${{ github.sha }} manually (screw you, Node.js!)"

      - name: Install devenv and run tests
        run: |
          nix profile install nixpkgs#devenv
          devenv shell test
        timeout-minutes: 10
