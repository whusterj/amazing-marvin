name: Lint

on: push

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: black
            run: black --check .
          - name: flake8
            run: flake8 .
          - name: isort
            run: isort --check-only .
          - name: mypy
            run: mypy
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ${{ matrix.run }}
