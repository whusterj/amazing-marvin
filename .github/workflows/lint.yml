name: Lint

on: push

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: black
            run: black --check .
          - name: flake8
            run: flake8 .
          - name: isort
            run: isort --check-only .
          - name: mypy
            run: mypy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: ${{ matrix.run }}
