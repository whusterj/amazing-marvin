name: Lint

on: push

jobs:
  lint:
    runs-on: ubuntu-latest
    container: nixos/nix:latest
    steps:
      - name: Manual checkout (no Node.js required!)
        run: |
          git clone \
            https://x-access-token:${{ github.token }}@github.com/${{ github.repository }} .
          git checkout ${{ github.sha }}
          echo "📁 Checked out ${{ github.sha }} manually (screw you, Node.js!)"

      - name: Install devenv and check code
        run: |
          nix profile install nixpkgs#devenv
          devenv shell format-check
          devenv shell lint
        timeout-minutes: 10
